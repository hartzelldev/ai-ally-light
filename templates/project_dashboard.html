<div id="project-scope">
    <header>
        <h1>Project: {{ display_name }}</h1>
        <nav aria-label="Project Actions">
            <button hx-get="/projects/settings/{{ project_name }}" hx-target="#modal-container">Project Settings</button>
            <button hx-get="/projects/rename-prompt/{{ project_name }}" hx-target="#modal-container">Rename</button>
			<button class="btn-warning" 
				hx-post="/projects/reindex-all/{{ project_name }}"
				hx-confirm="This will rebuild the entire database using current settings. Proceed?"
				hx-target="#file-list">
					Reindex All Files
			</button>
			<button style="color: red;" 
				hx-delete="/projects/delete/{{ project_name }}" 
				hx-target="#main-content" 
				hx-confirm="Are you sure you want to delete this project?">
			Delete Project
			</button>
            <button hx-get="/projects/list" hx-target="#main-content">Back to All Projects</button>
        </nav>
    </header>

    <hr>

    <div style="display: flex; gap: 2rem;">
        <aside style="flex: 1;" role="complementary">
            <section id="threads-section">
                <h2>Threads</h2>
                <button hx-post="/projects/threads/new/{{ project_name }}" hx-target="#chat-window">New Thread</button>
                <div id="thread-list" hx-get="/threads/list/{{ project_name }}" hx-trigger="load">
                    </div>
            </section>

            <section id="files-section" style="margin-top: 2rem;">
                <h2>Files & Indexing</h2>
<form hx-encoding="multipart/form-data" 
      hx-post="/projects/files/upload/{{ project_name }}" 
      hx-target="#file-list"> <label for="file-upload">Upload Asset:</label>
    <input type="file" id="file-upload" name="file">
    <button type="submit">Upload</button>
</form>

<div id="file-list" 
     hx-get="/projects/files/list/{{ project_name }}" 
     hx-trigger="load">
    </div>

        <section style="flex: 2;" id="chat-interface">
            <h2>Chat</h2>
            <div id="chat-window" 
                 style="height: 400px; border: 1px solid #ccc; overflow-y: auto; margin-bottom: 1rem;" 
                 aria-live="polite">
                <p>Select a thread or start a new one to begin chatting.</p>
            </div>
            
            <form hx-post="/chat/send/{{ project_name }}" hx-target="#chat-window" hx-swap="beforeend">
                <label for="user-input" class="visually-hidden">Message:</label>
                <textarea id="user-input" name="message" rows="3" style="width: 100%;" placeholder="Type your message here..."></textarea>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </div>
</div>
