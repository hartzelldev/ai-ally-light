<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Ally Light</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body hx-headers='{"X-Base-Page": "index"}'>
    <header>
        <a href="#main-content" class="skip-link" style="position: absolute; left: -10000px;">Skip to main content</a>
        <h1>AI Ally Light</h1>
        <nav>
            <button 
                hx-get="/settings/modal" 
                hx-target="#modal-container" 
                hx-trigger="click"
                hx-on::after-settle="document.getElementById('settings-modal')?.focus()"
                aria-haspopup="dialog">
                Global Settings
            </button>
        </nav>
    </header>

    <main id="main-content" tabindex="-1">
        <div id="global-alert" 
             role="status" 
             aria-live="polite" 
             style="min-height: 1.5em; margin: 10px 0;">
             {% if message %}{{ message }}{% endif %}
        </div>

        <section id="project-management" aria-labelledby="projects-heading">
            <h2 id="projects-heading">Projects</h2>
            
            <form hx-post="/projects/create" 
                  hx-target="#project-list-container"
                  hx-on::after-request="this.reset()">
                <label for="project_name">New Project Name:</label>
                <input type="text" id="project_name" name="project_name" required>
                <button type="submit">Create Project</button>
            </form>

            <div id="project-list-container" 
                 hx-get="/projects/list" 
                 hx-trigger="load" 
                 aria-busy="false">
                <p>Loading projects...</p>
            </div>
        </section>

        <hr>

        <section id="active-workspace" aria-live="polite">
            <div id="chat">
                <p>Select a project from the list above or open settings to begin.</p>
            </div>
        </section>
        
    </main>

    <div id="modal-container"></div>

    <script>
        // Placeholder for future sound logic
        document.body.addEventListener('htmx:afterOnLoad', function(evt) {
            // We can trigger sounds here based on event details
            console.log("Content loaded:", evt.detail.target.id);
        });
    </script>
</body>
</html>
