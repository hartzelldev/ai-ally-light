<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Ally Light</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>AI Ally Light</h1>
        <nav>
			<button 
				hx-get="/settings/modal" 
				hx-target="#modal-container" 
				hx-trigger="click"
				hx-on::after-settle="document.getElementById('settings-modal').focus()"
				aria-haspopup="dialog">
				Global Settings
			</button>        </nav>
    </header>

	<main id="main-content">
		<section id="project-management">
			<h2>Projects</h2>
			
			<form hx-post="/projects/create" hx-target="#project-list-container">
				<label for="project_name">New Project Name:</label>
				<input type="text" id="project_name" name="project_name" required>
				<button type="submit">Create Project</button>
			</form>

			<div id="project-list-container" 
				 hx-get="/projects/list" 
				 hx-trigger="load" 
				 aria-live="polite">
				</div>
		</section>

		<section id="chat">
			<p>Select a project or open settings to begin.</p>
		</section>
		
    </main>

    <div id="modal-container" aria-live="polite"></div>
</body>
</html>
