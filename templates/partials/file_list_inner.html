<table class="file-table" role="grid">
    <thead>
        <tr>
            <th scope="col">Filename</th>
            <th scope="col">Size</th>
            <th scope="col">Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for file in files %}
        <tr id="file-row-{{ loop.index }}">
            <th scope="row">{{ file.name }}</th>
            <td>{{ file.size_kb }} KB</td>
            <td>
                <div class="button-group">
                    <button class="btn-secondary" 
                        hx-post="/projects/files/reindex/{{ project_name }}/{{ file.name }}"
                        hx-target="#file-list-container"
                        hx-indicator="#upload-indicator"
                        aria-label="Reindex {{ file.name }}">
                        Reindex
                    </button>

                    <button class="btn-danger" 
                        hx-delete="/projects/files/delete/{{ project_name }}/{{ file.name }}"
                        hx-confirm="Are you sure you want to delete {{ file.name }} from the project index?"
                        hx-target="#file-list-container"
                        aria-label="Delete {{ file.name }}"
                        style="color: #cc0000; margin-left: 0.5rem;">
                        Delete
                    </button>
                </div>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="3" role="status" style="text-align: center; padding: 2rem;">
                No files uploaded yet for this project.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
