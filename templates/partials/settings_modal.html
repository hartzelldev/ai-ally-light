<div id="settings-modal" class="modal-overlay" role="dialog" aria-labelledby="modal-title" aria-modal="true" tabindex="-1">
    <div class="modal-content">
        <h2 id="modal-title">Global Settings</h2>
        
        <div id="settings-status" role="status" aria-live="polite" style="min-height: 1.5em; color: blue;"></div>

        <form hx-post="/settings/save" 
              hx-target="#settings-status"
              hx-indicator="#save-indicator">
            
            <fieldset>
                <legend>Chat Settings</legend>

                <label for="chat_provider">Chat Provider:</label>
                <select id="chat_provider" name="chat_provider"
                        hx-get="/settings/chat-fields" 
                        hx-target="#chat-fields-wrapper" 
                        hx-trigger="change">
                    {% for p in providers %}
                    <option value="{{ p }}" {% if config.chat.provider == p %}selected{% endif %}>{{ p|capitalize }}</option>
                    {% endfor %}
                </select>

                <div id="chat-fields-wrapper">
                    {% include 'partials/chat_fields_inner.html' %}
                </div>

                <label for="chat_model">Chat Model:</label>
                <input type="text" id="chat_model" name="chat_model" value="{{ config.chat.model }}">

                <label for="temperature">Temperature (0.0 - 1.0):</label>
                <input type="number" id="temperature" name="temperature" step="0.1" min="0" max="1" value="{{ config.chat.temperature }}">
            </fieldset>

            <fieldset style="margin-top: 1.5rem;">
                <legend>Embedding Settings</legend>
                <div class="settings-group">
                    <label for="embed_provider">Default Embeddings Provider:</label>
                    <select id="embed_provider" 
                            name="embed_provider" 
                            onchange="toggleEmbedFields(this.value)">
                        <optgroup label="Local (No API Required)">
                            <option value="builtin" {% if config.embed_provider == 'builtin' %}selected{% endif %}>Built-In (Local - MiniLM)</option>
                            <option value="ollama" {% if config.embed_provider == 'ollama' %}selected{% endif %}>Ollama (Local)</option>
                        </optgroup>
                        <optgroup label="Cloud (API Key Required)">
                            <option value="openrouter" {% if config.embed_provider == 'openrouter' %}selected{% endif %}>OpenRouter</option>
                            <option value="huggingface" {% if config.embed_provider == 'huggingface' %}selected{% endif %}>HuggingFace (Remote)</option>
                            <option value="other" {% if config.embed_provider == 'other' %}selected{% endif %}>Other (Custom)</option>
                        </optgroup>
                    </select>
                </div>

                {% include "partials/embed_key_field_inner.html" %}

                <div style="margin-top: 1rem;">
                    <p id="method-label" style="font-weight: bold;">Select Chunking Strategy:</p>
                    <div role="radiogroup" aria-labelledby="method-label">
                        <input type="radio" id="method_size" name="embed_method" value="size" 
                               hx-get="/settings/embed-fields" hx-target="#embed-fields-wrapper"
                               {% if config.embeddings.method == 'size' %}checked{% endif %}>
                        <label for="method_size">Size Chunking</label>

                        <input type="radio" id="method_delimiter" name="embed_method" value="delimiter" 
                               hx-get="/settings/embed-fields" hx-target="#embed-fields-wrapper"
                               {% if config.embeddings.method == 'delimiter' %}checked{% endif %}>
                        <label for="method_delimiter">Delimiter Chunking</label>

                        <input type="radio" id="method_full" name="embed_method" value="full" 
                               hx-get="/settings/embed-fields" hx-target="#embed-fields-wrapper"
                               {% if config.embeddings.method == 'full' %}checked{% endif %}>
                        <label for="method_full">Full Context</label>
                    </div>
                </div>

                <div id="embed-fields-wrapper">
                    {% include 'partials/embed_fields_inner.html' %}
                </div>
            </fieldset>
            
            <fieldset style="margin-top: 1.5rem;">
                <legend>Application Preferences</legend>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="event_beep" name="event_beep" {% if config.event_beep %}checked{% endif %}>
                    <label for="event_beep">Sound beep on completion (WIP)</label>
                </div>

                <label for="max_history">Max History Turns:</label>
                <input type="number" id="max_history" name="max_history" value="{{ config.max_history_turns }}">
            </fieldset>

            <div class="modal-actions" style="margin-top: 2rem;">
                <button type="submit" class="btn-save">Save All Settings</button>
                <button type="button" class="btn-cancel" onclick="this.closest('#settings-modal').remove()">Close</button>
                <span id="save-indicator" class="htmx-indicator">Saving...</span>
            </div>
        </form>
    </div>
</div>

<script>
/**
 * Simple toggle for API key visibility.
 * Even for a screen reader, hiding irrelevant fields reduces clutter.
 */
function toggleEmbedFields(val) {
    const container = document.getElementById('embed-api-key-container');
    if (!container) return;
    const localProviders = ['builtin', 'ollama'];
    container.style.display = localProviders.includes(val) ? 'none' : 'block';
}

// Initial run to set state if modal is re-opened
toggleEmbedFields(document.getElementById('embed_provider').value);
</script>
