<div id="embed-api-key-container" 
     class="settings-group" 
     style="display: {% if config.embed_provider in ['builtin', 'ollama'] %}none{% else %}block{% endif %};"
     {% if config.embed_provider in ['builtin', 'ollama'] %}aria-hidden="true"{% endif %}>
    
    <div class="setting-row" style="margin-bottom: 1rem;">
        <label for="embed_base_url">Embeddings Base URL:</label>
        <input type="text" 
               id="embed_base_url" 
               name="embed_base_url" 
               placeholder="e.g., https://api.openrouter.ai/v1"
               value="{{ config.embed_base_url or '' }}"
               aria-describedby="base-url-help">
        <p id="base-url-help" class="visually-hidden">Only required if using a custom or local provider like OpenRouter or a specific API endpoint.</p>
    </div>

    <div class="setting-row">
        <label for="embed_api_key">Embeddings API Key:</label>
        <input type="password" 
               id="embed_api_key" 
               name="embed_api_key" 
               autocomplete="off"
               placeholder="Enter API Key"
               value="{{ config.embed_api_key or '' }}">
    </div>
</div>
