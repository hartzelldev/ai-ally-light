<div id="project-embed-fields-wrapper" aria-live="polite">
    {% set current_method = config.embed_method %}
    
    {% if current_method == 'size' %}
        <label for="chunk_size">Chunk Size (Words):</label>
        <input type="number" id="chunk_size" name="chunk_size" value="{{ config.chunk_size }}">

        <label for="chunk_overlap">Chunk Overlap:</label>
        <input type="number" id="chunk_overlap" name="chunk_overlap" value="{{ config.chunk_overlap }}">

    {% elif current_method == 'delimiter' %}
        <label for="delimiter">Delimiter String (e.g., \n\n):</label>
        <input type="text" id="delimiter" name="delimiter" value="{{ config.delimiter }}">

    {% elif current_method == 'full' %}
        <p><em>Full Context mode: The entire file will be sent as a single block.</em></p>
    {% endif %}
</div>
