<li class="thread-item" id="thread-{{ thread.id }}">
    <a href="/chat/{{ project_name }}/{{ thread.id }}" 
       hx-get="/chat/{{ project_name }}/{{ thread.id }}"
       hx-target="#chat-window"
       aria-label="Open thread: {{ thread.name }}">
       {{ thread.name }}
    </a>
    
    <div class="thread-controls">
        <button hx-get="/threads/rename-form/{{ project_name }}/{{ thread.id }}" 
                hx-target="#thread-{{ thread.id }}"
                aria-label="Rename {{ thread.name }}">✏️</button>
                
        <button hx-delete="/threads/delete/{{ project_name }}/{{ thread.id }}" 
                hx-confirm="Are you sure you want to delete this entire thread?"
                hx-target="#thread-{{ thread.id }}"
                hx-swap="outerHTML"
                aria-label="Delete {{ thread.name }}">🗑️</button>
    </div>
</li>
