<div id="project-settings-modal" class="modal-overlay" role="dialog" aria-labelledby="proj-modal-title" tabindex="-1">
    <div class="modal-content">
        <h2 id="proj-modal-title">Settings for {{ display_name }}</h2>
        
        <div id="proj-settings-status" aria-live="assertive">
            <span class="visually-hidden">Adjusting overrides for {{ display_name }}</span>
        </div>

        <form hx-post="/projects/save-settings/{{ project_name }}" hx-target="#proj-settings-status">
            
            <fieldset>
                <legend>Project AI Personality</legend>

                <label for="chat_provider">Chat Provider:</label>
                <select id="chat_provider" name="chat_provider">
                    {% for key, info in chat_providers.items() %}
                    <option value="{{ key }}" {% if config.chat_provider == key %}selected{% endif %}>
                        {{ info.name }}
                    </option>
                    {% endfor %}
                </select>

                <label for="chat_model">Chat Model:</label>
                <input type="text" id="chat_model" name="chat_model" value="{{ config.chat_model }}">

                <label for="chat_api_key">Chat API Key (Overrides Global):</label>
                <input type="password" id="chat_api_key" name="chat_api_key" 
                       value="{{ config.chat_api_key or '' }}" 
                       placeholder="Leave blank to use global key">

                <label for="temperature">Temperature (0.0 - 1.0):</label>
                <input type="number" id="temperature" name="temperature" step="0.1" min="0" max="1" value="{{ config.temperature }}">

                <label for="system_prompt">System Prompt (Project Persona):</label>
                <textarea id="system_prompt" name="system_prompt" rows="6" style="width: 100%;">{{ config.system_prompt }}</textarea>
            </fieldset>

            <fieldset style="margin-top: 1.5rem;">
                <legend>Project Embedding Strategy</legend>

                <label for="embed_provider">Embeddings Provider:</label>
                <select id="embed_provider" name="embed_provider">
                    {% for key, info in embed_providers.items() %}
                    <option value="{{ key }}" {% if config.embed_provider == key %}selected{% endif %}>
                        {{ info.name }}
                    </option>
                    {% endfor %}
                </select>

                <label for="embed_model">Embedding Model:</label>
                <input type="text" id="embed_model" name="embed_model" value="{{ config.embed_model }}">

                <label for="embed_api_key">Embedding API Key (Overrides Global):</label>
                <input type="password" id="embed_api_key" name="embed_api_key" 
                       value="{{ config.embed_api_key or '' }}" 
                       placeholder="Leave blank to use global key">

                <label for="embed_method">Chunking Strategy:</label>
                <select id="embed_method" name="embed_method">
                    <option value="size" {% if config.embed_method == 'size' %}selected{% endif %}>Size Chunking</option>
                    <option value="delimiter" {% if config.embed_method == 'delimiter' %}selected{% endif %}>Delimiter Chunking</option>
                    <option value="full" {% if config.embed_method == 'full' %}selected{% endif %}>Full Context</option>
                </select>

                <label for="chunk_size">Chunk Size:</label>
                <input type="number" id="chunk_size" name="chunk_size" value="{{ config.chunk_size }}">

                <label for="chunk_overlap">Chunk Overlap:</label>
                <input type="number" id="chunk_overlap" name="chunk_overlap" value="{{ config.chunk_overlap }}">
            </fieldset>

            <div class="modal-actions" style="margin-top: 2rem;">
                <button type="submit" class="btn-save">Save Project Settings</button>
                <button type="button" class="btn-cancel" onclick="document.getElementById('project-settings-modal').remove()">Close</button>
            </div>
        </form>
    </div>
</div>
