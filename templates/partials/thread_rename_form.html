<li class="thread-item editing" id="thread-{{ thread.id }}" role="listitem">
    <form hx-post="/threads/rename/{{ project_name }}/{{ thread.id }}" 
          hx-target="#thread-{{ thread.id }}" 
          hx-swap="outerHTML"
          class="rename-form">
        
        <label for="new-thread-name-{{ thread.id }}" class="visually-hidden">
            New name for thread {{ thread.name }}
        </label>
        
        <input type="text" 
               id="new-thread-name-{{ thread.id }}" 
               name="new_name" 
               value="{{ thread.name }}" 
               autofocus 
               onfocus="this.select()"
               aria-label="Edit thread name">

        <div class="thread-controls">
            <button type="submit" 
                    title="Save Changes" 
                    aria-label="Save new name for {{ thread.name }}">
                <span aria-hidden="true">✅</span>
            </button>
            
            <button type="button" 
                    hx-get="/threads/item/{{ project_name }}/{{ thread.id }}" 
                    hx-target="#thread-{{ thread.id }}" 
                    hx-swap="outerHTML"
                    title="Cancel" 
                    aria-label="Cancel renaming {{ thread.name }}">
                <span aria-hidden="true">❌</span>
            </button>
        </div>
    </form>
</li>
