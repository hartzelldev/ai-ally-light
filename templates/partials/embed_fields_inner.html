<div id="embed-fields-wrapper" aria-live="polite">
    {% if method == 'size' %}
        <label for="chunk_size">Chunk Size (Words):</label>
        <input type="number" id="chunk_size" name="chunk_size" value="{{ config.embeddings.chunk_size }}">

        <label for="chunk_overlap">Chunk Overlap:</label>
        <input type="number" id="chunk_overlap" name="chunk_overlap" value="{{ config.embeddings.chunk_overlap }}">

        <label for="top_k">Top K Results:</label>
        <input type="number" id="top_k" name="top_k" value="{{ config.embeddings.top_k }}">

    {% elif method == 'delimiter' %}
        <label for="delimiter">Delimiter String (e.g., \n\n):</label>
        <input type="text" id="delimiter" name="delimiter" value="{{ config.embeddings.delimiter }}">

    {% elif method == 'full' %}
        <p><em>Full Context mode: The entire file will be sent as a single block. No additional settings required.</em></p>
    {% endif %}
</div>
