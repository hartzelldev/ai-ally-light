<div class="setting-row">
    <label for="chat_api_key">Chat API Key:</label>
    <input type="password" 
           id="chat_api_key" 
           name="chat_api_key" 
           value="{{ api_key }}"
           autocomplete="off"
           {% if provider == 'ollama' %} 
               disabled 
               aria-disabled="true"
               placeholder="Not required for Ollama" 
           {% else %}
               placeholder="Enter your API key"
           {% endif %}>
</div>

<div class="setting-row" style="margin-top: 1rem;">
    <label for="chat_base_url">Chat Base URL:</label>
    <input type="text" 
           id="chat_base_url" 
           name="chat_base_url" 
           value="{{ base_url }}"
           aria-describedby="chat-url-help">
    <p id="chat-url-help" class="visually-hidden">
        The API endpoint for {{ provider|capitalize }}. Leave default unless using a proxy or local server.
    </p>
</div>

<div class="setting-link" style="margin-top: 1rem;">
    <a href="{{ model_link }}" 
       target="_blank" 
       rel="noopener"
       aria-label="View available models for {{ provider|capitalize }} on their website, opens in a new tab">
       Browse {{ provider|capitalize }} Models
    </a>
</div>
