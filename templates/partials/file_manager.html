<section id="file-manager" aria-labelledby="files-header">
    <h3 id="files-header">Project Files</h3>
    
    <form hx-encoding="multipart/form-data" 
          hx-post="/projects/files/upload/{{ project_name }}" 
          hx-target="#file-list-container"
          hx-indicator="#upload-indicator"
          hx-on::after-request="this.reset()">
        
        <div class="upload-group">
            <label for="file-upload" class="visually-hidden">Upload new asset</label>
            <input type="file" id="file-upload" name="file" multiple required aria-label="Select files">
            
            <button type="submit" class="btn-action">
                Upload and Index
            </button>
        </div>

        <div id="upload-indicator" class="htmx-indicator" role="status" aria-live="polite">
            <p>Uploading and indexing file, please wait...</p>
        </div>
    </form>

    <div id="file-list-container" 
         hx-get="/projects/files/list/{{ project_name }}" 
         hx-trigger="load, fileListChanged from:body"
         aria-busy="false">
        {% include 'partials/file_list_inner.html' %}
    </div>
</section>
