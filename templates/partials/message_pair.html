<article class="message user" aria-label="Your message">
    <h3 class="visually-hidden">You said:</h3>
    <div class="message-content user-msg">
        <strong>You:</strong> {{ user_msg }}
    </div>
</article>

<hr aria-hidden="true">

<article class="message assistant" aria-label="Ally's message">

        <strong>Ally:</strong> {{ ai_msg }}
    </div>
</article>

<hr aria-hidden="true">
